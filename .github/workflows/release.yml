name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  VPK_VERSION: 1.2.161

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install vpk --tool-path ./target/tools --version $env:VPK_VERSION
      - name: Release version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = ($metadata.packages | Where-Object name -eq 'peetclip').version.Split('.')
          $version = "$($base[0]).$($base[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Format
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build and package installer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/package.ps1 -Version $env:RELEASE_VERSION -Vpk ./target/tools/vpk.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: target/releases/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Retry a partially uploaded draft, but never mutate a published release.
          if gh release view "$tag" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = false ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            printf 'Windows x64 installer: **PeetClip-win-Setup.exe**.\n\nInstalls for the current user with a sign-in shortcut. Updates download automatically and apply on the next app launch.\n\nSource commit: %s\n' "$COMMIT" > notes.md
            gh release create "$tag" --draft --target "$COMMIT" --title "PeetClip $VERSION" --notes-file notes.md
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest
