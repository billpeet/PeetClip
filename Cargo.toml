[package]
name = "peetclip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A keyboard-first Windows clipboard manager"
repository = "https://github.com/billpeet/PeetClip"

[features]
ui-smoke-test = []

[dependencies]
velopack = "=1.2.161"
windows-reactor = "=0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3"
windows-reactor-setup = "=0.100.0"
